name: ci

on:
  push:
    branches: [main, audit-no-assumptions]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pyyaml==6.0.3 \
            packaging==24.2 \
            'psycopg[binary]>=3.2,<4' \
            pytest==9.1.1 \
            pytest-cov==7.1.0 \
            ruff==0.16.6 \
            pyright==1.1.411

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Pyright
        run: python -m pyright

      - name: Tests with coverage gate (>= 75%)
        run: python -m pytest --cov=vulnassess --cov-fail-under=75
